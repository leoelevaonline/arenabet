<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Arena de jogos</title>
  <desc id="desc">Mesa de jogos abstrata em tons verdes e dourados</desc>
  <defs>
    <radialGradient id="bg" cx="75%" cy="20%" r="90%">
      <stop offset="0" stop-color="#166534"/>
      <stop offset="0.45" stop-color="#09251a"/>
      <stop offset="1" stop-color="#030706"/>
    </radialGradient>
    <linearGradient id="table" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#16a34a"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#8b542d"/>
      <stop offset=".42" stop-color="#3b2013"/>
      <stop offset="1" stop-color="#120905"/>
    </linearGradient>
    <radialGradient id="felt" cx="42%" cy="32%" r="82%">
      <stop stop-color="#29a86d"/>
      <stop offset=".58" stop-color="#0d633e"/>
      <stop offset="1" stop-color="#042819"/>
    </radialGradient>
    <radialGradient id="ballGold" cx="28%" cy="24%" r="76%">
      <stop stop-color="#fff7c2"/>
      <stop offset=".25" stop-color="#fbbf24"/>
      <stop offset=".78" stop-color="#b45309"/>
      <stop offset="1" stop-color="#451a03"/>
    </radialGradient>
    <radialGradient id="ballIvory" cx="28%" cy="24%" r="76%">
      <stop stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#e7e5e4"/>
      <stop offset="1" stop-color="#57534e"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="tableShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="32" stdDeviation="24" flood-color="#000" flood-opacity=".65"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1260" cy="170" r="220" fill="#10b981" opacity=".16" filter="url(#glow)"/>
  <circle cx="260" cy="760" r="270" fill="#f59e0b" opacity=".09" filter="url(#glow)"/>
  <g transform="translate(820 475) rotate(-8)" filter="url(#tableShadow)">
    <rect x="-456" y="-241" width="912" height="482" rx="120" fill="#0a0502" stroke="#fef3c7" stroke-opacity=".14" stroke-width="8"/>
    <rect x="-438" y="-223" width="876" height="446" rx="108" fill="url(#wood)" stroke="#d6a15a" stroke-opacity=".48" stroke-width="6"/>
    <rect x="-392" y="-177" width="784" height="354" rx="82" fill="url(#felt)" stroke="#082c1d" stroke-width="22"/>
    <rect x="-382" y="-167" width="764" height="334" rx="74" fill="none" stroke="#8ee5b7" stroke-opacity=".2" stroke-width="3"/>
    <circle cx="-382" cy="-167" r="24" fill="#070707"/><circle cx="382" cy="-167" r="24" fill="#070707"/>
    <circle cx="-382" cy="167" r="24" fill="#070707"/><circle cx="382" cy="167" r="24" fill="#070707"/>
    <circle cx="0" cy="-177" r="22" fill="#070707"/><circle cx="0" cy="177" r="22" fill="#070707"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#d1fae5" stroke-opacity=".16" stroke-width="3"/>
    <path d="M-392 0H392M0-177V177" stroke="#d1fae5" stroke-opacity=".1" stroke-width="2"/>
    <g>
      <circle cx="86" cy="-24" r="23" fill="url(#ballGold)" stroke="#fff7c2" stroke-opacity=".28" stroke-width="2"/>
      <circle cx="124" cy="16" r="23" fill="url(#ballIvory)" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>
      <circle cx="164" cy="-4" r="23" fill="url(#ballGold)" stroke="#fff7c2" stroke-opacity=".28" stroke-width="2"/>
      <circle cx="203" cy="37" r="23" fill="url(#ballIvory)" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>
      <circle cx="242" cy="17" r="23" fill="url(#ballGold)" stroke="#fff7c2" stroke-opacity=".28" stroke-width="2"/>
    </g>
    <path d="M-258 116L128 8" stroke="#5b3518" stroke-opacity=".8" stroke-width="10" stroke-linecap="round"/>
    <path d="M-262 118L128 10" stroke="#f0d1a1" stroke-opacity=".9" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-281" cy="123" r="18" fill="url(#ballIvory)" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
  </g>
  <g fill="#fbbf24">
    <circle cx="1195" cy="350" r="48"/><circle cx="1270" cy="420" r="34" opacity=".8"/><circle cx="1110" cy="440" r="25" opacity=".6"/>
  </g>
  <g fill="#f8fafc" opacity=".85" transform="translate(1040 590) rotate(14)">
    <rect width="125" height="180" rx="16"/><rect x="76" y="32" width="125" height="180" rx="16" opacity=".85"/>
    <text x="24" y="60" font-family="serif" font-size="44" fill="#be123c">A</text><text x="100" y="92" font-family="serif" font-size="44" fill="#111827">K</text>
  </g>
</svg>
